<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собрать напиток — Bean &amp; Leaf</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/builder.css">
</head>
<body>

    <!-- ШАПКА -->
    <header class="header">
        <a href="index.html" class="logo">☕ Bean &amp; Leaf</a>
        <nav class="nav">
            <a href="index.html" class="nav__link">Главная</a>
            <a href="menu.html" class="nav__link">Меню</a>
            <a href="builder.html" class="nav__link nav__link--active">Собрать напиток</a>
        </nav>
    </header>

    <!-- ЗАГОЛОВОК -->
    <section class="page-head">
        <h1 class="page-head__title">Собери свой напиток</h1>
        <p class="page-head__subtitle">Выбирай ингредиенты — цена и состав обновятся сами</p>
    </section>

    <!-- КОНСТРУКТОР -->
    <section class="section">
        <div class="builder">

            <!-- ЛЕВАЯ КОЛОНКА: ПРЕВЬЮ -->
            <aside class="builder__preview">
                <div class="builder__cup" id="builderCup">☕</div>
                <h2 class="builder__name" id="builderName">Эспрессо</h2>
                <p class="builder__composition" id="builderComposition">Эспрессо · S · без молока</p>
                <div class="builder__price" id="builderPrice">120 ₽</div>
                <button class="btn btn--primary" id="builderOrderBtn" type="button">Заказать</button>
            </aside>

            <!-- ПРАВАЯ КОЛОНКА: ВЫБОР -->
            <div class="builder__options">

                <!-- Основа -->
                <div class="option-group">
                    <h3 class="option-group__title">Основа</h3>
                    <div class="picker" data-group="base">
                        <button class="picker__item picker__item--active" data-id="espresso" data-price="120" data-label="Эспрессо" data-emoji="☕" type="button">
                            <span class="picker__emoji">☕</span>
                            <span class="picker__label">Эспрессо</span>
                            <span class="picker__price">120 ₽</span>
                        </button>
                        <button class="picker__item" data-id="americano" data-price="150" data-label="Американо" data-emoji="🖤" type="button">
                            <span class="picker__emoji">🖤</span>
                            <span class="picker__label">Американо</span>
                            <span class="picker__price">150 ₽</span>
                        </button>
                        <button class="picker__item" data-id="latte" data-price="190" data-label="Латте" data-emoji="🥛" type="button">
                            <span class="picker__emoji">🥛</span>
                            <span class="picker__label">Латте</span>
                            <span class="picker__price">190 ₽</span>
                        </button>
                        <button class="picker__item" data-id="cappuccino" data-price="180" data-label="Капучино" data-emoji="🧋" type="button">
                            <span class="picker__emoji">🧋</span>
                            <span class="picker__label">Капучино</span>
                            <span class="picker__price">180 ₽</span>
                        </button>
                    </div>
                </div>

                <!-- Молоко -->
                <div class="option-group">
                    <h3 class="option-group__title">Молоко</h3>
                    <div class="picker" data-group="milk">
                        <button class="picker__item picker__item--active" data-id="none" data-price="0" data-label="Без молока" data-emoji="🚫" type="button">
                            <span class="picker__emoji">🚫</span>
                            <span class="picker__label">Без молока</span>
                            <span class="picker__price">0 ₽</span>
                        </button>
                        <button class="picker__item" data-id="regular" data-price="30" data-label="Обычное" data-emoji="🥛" type="button">
                            <span class="picker__emoji">🥛</span>
                            <span class="picker__label">Обычное</span>
                            <span class="picker__price">+30 ₽</span>
                        </button>
                        <button class="picker__item" data-id="oat" data-price="50" data-label="Овсяное" data-emoji="🌾" type="button">
                            <span class="picker__emoji">🌾</span>
                            <span class="picker__label">Овсяное</span>
                            <span class="picker__price">+50 ₽</span>
                        </button>
                    </div>
                </div>

                <!-- Размер -->
                <div class="option-group">
                    <h3 class="option-group__title">Размер</h3>
                    <div class="picker" data-group="size">
                        <button class="picker__item picker__item--active" data-id="s" data-price="0" data-label="S · 250 мл" data-mult="1" type="button">
                            <span class="picker__label">S · 250 мл</span>
                        </button>
                        <button class="picker__item" data-id="m" data-price="40" data-label="M · 350 мл" data-mult="1.15" type="button">
                            <span class="picker__label">M · 350 мл</span>
                        </button>
                        <button class="picker__item" data-id="l" data-price="70" data-label="L · 450 мл" data-mult="1.3" type="button">
                            <span class="picker__label">L · 450 мл</span>
                        </button>
                    </div>
                </div>

                <!-- Топпинги (можно несколько) -->
                <div class="option-group">
                    <h3 class="option-group__title">Топпинги <small>(можно несколько)</small></h3>
                    <div class="picker" data-group="toppings" data-multi="true">
                        <button class="picker__item" data-id="syrup" data-price="40" data-label="Сироп" data-emoji="🍯" type="button">
                            <span class="picker__emoji">🍯</span>
                            <span class="picker__label">Сироп</span>
                            <span class="picker__price">+40 ₽</span>
                        </button>
                        <button class="picker__item" data-id="cinnamon" data-price="20" data-label="Корица" data-emoji="🌿" type="button">
                            <span class="picker__emoji">🌿</span>
                            <span class="picker__label">Корица</span>
                            <span class="picker__price">+20 ₽</span>
                        </button>
                        <button class="picker__item" data-id="marshmallow" data-price="30" data-label="Маршмеллоу" data-emoji="🍡" type="button">
                            <span class="picker__emoji">🍡</span>
                            <span class="picker__label">Маршмеллоу</span>
                            <span class="picker__price">+30 ₽</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- ФОРМА ЗАКАЗА (скрыта, открывается по кнопке "Заказать") -->
    <div class="order-modal" id="orderModal" aria-hidden="true">
        <div class="order-modal__content">
            <button class="order-modal__close" id="orderModalClose" aria-label="Закрыть">&times;</button>
            <h2>Оформление заказа</h2>
            <p class="order-modal__summary" id="orderSummary"></p>
            <form class="order-form" id="orderForm" novalidate>
                <div class="form-field">
                    <label for="orderName">Имя</label>
                    <input type="text" id="orderName" name="name" placeholder="Как к вам обращаться">
                    <span class="form-error" data-error-for="orderName"></span>
                </div>
                <div class="form-field">
                    <label for="orderPhone">Телефон</label>
                    <input type="tel" id="orderPhone" name="phone" placeholder="+7 (___) ___-__-__">
                    <span class="form-error" data-error-for="orderPhone"></span>
                </div>
                <div class="form-field">
                    <label for="orderComment">Комментарий</label>
                    <textarea id="orderComment" name="comment" rows="2" placeholder="Пожелания к заказу"></textarea>
                </div>
                <button type="submit" class="btn btn--primary">Подтвердить заказ</button>
            </form>
        </div>
    </div>

    <!-- ПОДВАЛ -->
    <footer class="footer">
        <p>© 2026 Bean &amp; Leaf. Учебный проект.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/builder.js"></script>
</body>
</html>
